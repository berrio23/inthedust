<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>In The Dust | WebGL</title>

  <!-- Unity template assets -->
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="stylesheet" href="TemplateData/diagnostics.css">
  <script src="TemplateData/diagnostics.js"></script>

  <!-- Hard‑override the template so the build always fills the browser viewport -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #unity-container {
      width: 100%;
      height: 100%;
    }
    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <!-- TemplateData loading UI (kept intact) -->
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
      <div id="unity-build-title">In The Dust</div>
    </div>
  </div>

  <script>
    const canvas = document.querySelector('#unity-canvas');

    // Simple banner passthrough — unchanged from Unity default
    function unityShowBanner(msg, type) {
      const banner = document.querySelector('#unity-warning');
      const div = document.createElement('div');
      div.textContent = msg;
      banner.appendChild(div);
      div.style = `background:${type === 'error' ? 'red' : 'yellow'};padding:10px;`;
      if (type !== 'error') setTimeout(() => banner.removeChild(div), 5000);
    }

    const buildUrl = 'Build';
    const loaderUrl = buildUrl + '/2dc56b9d673bdaaf0b4a56403fa1a0a6.loader.js';

    const config = {
      dataUrl:      buildUrl + '/f665788e879df5744c0345ab995e967e.data',
      frameworkUrl: buildUrl + '/5d17d0c27c64f87df8250555786334a1.framework.js',
      codeUrl:      buildUrl + '/c6956314e68a462af15e1bec3f768441.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Mr EdEd Productions',
      productName: 'In The Dust',
      productVersion: '1.0',
      showBanner: unityShowBanner,
    };

    // Apply mobile‑specific tweaks
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1, user-scalable=no, shrink-to-fit=yes';
      document.head.appendChild(meta);
      document.querySelector('#unity-container').className = 'unity-mobile';
      canvas.className = 'unity-mobile';
    }

    // Loader UI
    document.querySelector('#unity-loading-bar').style.display = 'block';

    const script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, progress => {
        document.querySelector('#unity-progress-bar-full').style.width = (progress * 100) + '%';
      }).then(unityInstance => {
        document.querySelector('#unity-loading-bar').style.display = 'none';
        document.getElementById('diagnostics-icon').onclick = () => unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
        document.querySelector('#unity-fullscreen-button').onclick = () => unityInstance.SetFullscreen(1);
      }).catch(alert);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
