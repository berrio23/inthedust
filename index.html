<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Unity Web Build</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #gameContainer {
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="gameContainer"></div>

  <script>
    // ---------------------------------------------------------
    //  Set buildName to match the filenames Unity generated.
    //  Example: Build/MyAwesomeGame.loader.js  -> buildName = "MyAwesomeGame"
    // ---------------------------------------------------------
    const buildName = "GAME";   // <-- CHANGE THIS
    const buildDir  = "Build";  // or rename if you moved the folder

    const loaderUrl  = `${buildDir}/${buildName}.loader.js`;
    const config = {
      dataUrl:      `${buildDir}/${buildName}.data`,
      frameworkUrl: `${buildDir}/${buildName}.framework.js`,
      codeUrl:      `${buildDir}/${buildName}.wasm`,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Company",
      productName: "Product",
      productVersion: "1.0"
    };

    const container = document.getElementById("gameContainer");
    const script    = document.createElement("script");
    script.src      = loaderUrl;
    script.onload   = () => {
      createUnityInstance(container, config).catch(err => console.error(err));
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
